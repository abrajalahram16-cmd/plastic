<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>معمل البلاستيك</title>
<meta name="theme-color" content="#2b3361">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{
  --navy:#0f1c3f;--navy2:#0a1530;--gold:#b6902a;
  --bg:#f3f5fa;--card:#ffffff;--border:#e7eaf3;--text:#1f2530;--muted:#7b8394;
  --green:#16a34a;--green-light:#e8f8ee;--red:#dc2626;--red-light:#fdeaea;
  --radius:14px;--shadow:0 2px 10px rgba(15,28,63,.06);
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Cairo',sans-serif;min-height:100vh;background-color:#f3f5fa}
button,input,select{font-family:inherit;font-size:15px}
.hidden{display:none !important}

/* top bar */
.topbar{background:var(--navy);color:#fff;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px;position:sticky;top:0;z-index:10}
.brand{font-weight:800;font-size:18px}
.brand small{display:block;font-weight:400;font-size:12px;opacity:.75}
.userbox{display:flex;align-items:center;gap:10px;font-size:13px}
.btn{border:0;border-radius:10px;padding:10px 16px;cursor:pointer;font-weight:700;min-height:44px}
.btn-primary{background:var(--navy);color:#fff}
.btn-gold{background:var(--gold);color:#fff}
.btn-ghost{background:rgba(255,255,255,.14);color:#fff}
.btn:disabled{opacity:.6;cursor:not-allowed}

/* tabs */
.tabs{display:flex;gap:8px;overflow-x:auto;padding:12px 16px;background:var(--card);border-bottom:1px solid var(--border);scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;border:1px solid var(--border);background:#fff;color:var(--text);border-radius:999px;padding:9px 16px;cursor:pointer;font-weight:600;min-height:40px;white-space:nowrap}
.tab.active{background:var(--navy);color:#fff;border-color:var(--navy)}

/* layout */
main{padding:16px;max-width:1000px;margin:0 auto}
.page-title{font-size:22px;font-weight:800;margin-bottom:14px;color:var(--navy)}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;margin-bottom:14px;border:1px solid var(--border)}
.card h3{font-size:16px;margin-bottom:8px;color:var(--navy)}
.card p{color:var(--muted);line-height:1.7;font-size:14px}
.badge{display:inline-block;background:var(--navy2);color:#fff;border-radius:999px;padding:4px 10px;font-size:12px;font-weight:700}
.badge-gold{background:var(--gold)}
.empty{text-align:center;color:var(--muted);padding:30px 10px}

/* forms */
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.login-card{width:100%;max-width:380px;background:#fff;border-radius:18px;box-shadow:var(--shadow);padding:28px 22px;border:1px solid var(--border)}
.login-card h1{color:var(--navy);font-size:22px;text-align:center;margin-bottom:4px}
.login-card .sub{text-align:center;color:var(--muted);font-size:13px;margin-bottom:20px}
label{display:block;font-size:13px;font-weight:700;margin:12px 0 6px;color:var(--text)}
input,select{width:100%;padding:12px 14px;border:1px solid var(--border);border-radius:10px;background:#fff;min-height:44px}
input:focus,select:focus{outline:2px solid var(--gold);border-color:transparent}
.msg{margin-top:12px;padding:10px 12px;border-radius:10px;font-size:14px;display:none}
.msg.err{background:var(--red-light);color:var(--red);display:block}
.msg.ok{background:var(--green-light);color:var(--green);display:block}
.login-card .btn{width:100%;margin-top:18px}

textarea{width:100%;padding:12px 14px;border:1px solid var(--border);border-radius:10px;font-family:inherit;font-size:15px;resize:vertical;background:#fff}
.checks{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
.check{display:flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--border);border-radius:10px;padding:8px 12px;font-weight:600;cursor:pointer;margin:0}
.check input{width:auto;min-height:0}
#assetList{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
#assetList .card{margin:0}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
@media (max-width:620px){.grid2{grid-template-columns:1fr}}
.hint{font-size:13px;color:var(--muted);margin-top:10px;min-height:18px}
.filter-row{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.filter-row label{margin:0}
.filter-row input{width:auto}
.sum-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;margin-bottom:14px}
.sum-box{background:var(--navy2);color:#fff;border-radius:12px;padding:12px}
.sum-box b{display:block;font-size:13px;opacity:.85;margin-bottom:4px}
.sum-box span{font-size:20px;font-weight:800}
.neg{color:var(--red);font-weight:700}
.grid-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.grid-cards .card{margin:0}
.trash{background:none;border:0;color:var(--red);cursor:pointer;font-weight:700;padding:6px}

/* table */
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:10px 8px;border-bottom:1px solid var(--border);text-align:right}
th{color:var(--muted);font-weight:700;font-size:13px}
td select{width:auto;min-width:150px;padding:8px 10px}

.loading{text-align:center;padding:60px 10px;color:var(--muted)}

/* ===== Visual theme (pastel cards, round icons, bottom bar) ===== */
:root{
  --navy:#2b3361;--navy2:#20274d;--gold:#ef8a6a;
  --bg:#f6e9e6;--card:#ffffff;--border:#f1e7ea;--text:#2b2e40;--muted:#8b8698;
  --radius:22px;--shadow:0 10px 26px rgba(80,50,90,.08);
}
body{background:linear-gradient(170deg,#f9e3df 0%,#f4e8f1 50%,#e8e6f5 100%) fixed;background-color:#f6e9e6}
main{padding:18px 16px 120px}
.topbar{background:transparent;color:var(--navy);padding:18px 18px 6px;position:static}
.brand{font-size:20px;color:var(--navy)}
.brand small{color:var(--muted);font-size:13px}
.topbar .btn-ghost{background:#fff;color:var(--navy);box-shadow:var(--shadow);border-radius:14px;min-height:38px;padding:8px 14px;font-size:14px}
.page-title{font-size:22px;color:var(--navy)}
.card{border:0;padding:20px}
.card h3{color:var(--navy);font-size:17px}
.btn{border-radius:16px}
.btn-primary{background:var(--navy);box-shadow:0 8px 18px rgba(43,51,97,.22)}
.btn-gold{background:var(--gold);color:#fff}
input,select,textarea{border:1px solid #efe6ea;background:#fbf9fb;border-radius:14px}
input:focus,select:focus,textarea:focus{outline:2px solid #f3b9a6;border-color:transparent}
label{color:#4b4f63}

/* bottom navigation: round icon + label */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:#fff;border:0;border-radius:26px 26px 0 0;box-shadow:0 -8px 28px rgba(80,50,90,.10);
  padding:10px 8px calc(10px + env(safe-area-inset-bottom));display:flex;justify-content:flex-start;gap:2px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;min-width:68px;border:0;background:none;color:var(--muted);font-size:11px;font-weight:700;padding:4px 6px;border-radius:16px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;min-height:0}
.tab .ico-wrap{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:#f7f1f4;color:var(--navy);transition:.15s}
.tab.active{color:var(--navy)}
.tab.active .ico-wrap{background:var(--navy);color:#fff;box-shadow:0 6px 14px rgba(43,51,97,.25)}
.ico{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;display:block}

/* home */
.hero{background:linear-gradient(135deg,#f9c3ac 0%,#f0937a 55%,#e8789f 100%);color:#fff;border-radius:28px;padding:22px 20px;box-shadow:0 14px 30px rgba(232,120,110,.28);margin-bottom:16px;position:relative;overflow:hidden}
.hero small{opacity:.92;font-size:13px}
.hero h1{font-size:24px;margin:4px 0 14px}
.hero .big{font-size:34px;font-weight:800;line-height:1.1}
.hero .big-label{font-size:13px;opacity:.95}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.tile{background:#fff;border-radius:22px;padding:14px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:8px}
.tile b{font-size:20px;color:var(--navy)}
.tile span{font-size:12px;color:var(--muted)}
.ico-circle{width:42px;height:42px;border-radius:50%;display:grid;place-items:center}
.ico-circle .ico{width:20px;height:20px}
.tone-1{background:#fde3d6;color:#e0704f}
.tone-2{background:#dcf1e7;color:#2f9e7a}
.tone-3{background:#e6e1fa;color:#6b5bc9}
.tone-4{background:#d9ecf9;color:#2f7fb8}
.section-title{font-size:16px;font-weight:800;color:var(--navy);margin:18px 2px 10px}
.mach-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.mach{background:#fff;border-radius:22px;padding:14px;box-shadow:var(--shadow)}
.mach b{display:block;color:var(--navy);margin-bottom:6px}
.mach .val{font-size:22px;font-weight:800;color:var(--navy)}
.mach .sub2{font-size:12px;color:var(--muted);margin-top:4px}
.bar{height:8px;background:#f3ecf0;border-radius:99px;overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#f3a48c,#e8789f);border-radius:99px}
.hist{width:100%;border-collapse:separate;border-spacing:0 8px}
.hist td{background:#fff;border:0;padding:12px 10px}
.hist tr td:first-child{border-radius:16px 0 0 16px}
.hist tr td:last-child{border-radius:0 16px 16px 0}
.hist th{border:0;padding:4px 10px}
.dlabel{font-size:12px;color:var(--navy);font-weight:700;margin-top:4px}
.login-wrap{background:transparent}
.login-card{border:0;border-radius:28px;box-shadow:0 18px 40px rgba(80,50,90,.12);max-width:400px;padding:30px 24px}
.logo-circle{width:64px;height:64px;border-radius:50%;background:linear-gradient(135deg,#f9c3ac,#e8789f);margin:0 auto 12px;display:grid;place-items:center;color:#fff}
.logo-circle .ico,.logo-circle svg{width:30px;height:30px;fill:none;stroke:#fff;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.link-btn{background:none;border:0;color:var(--navy);font-weight:700;margin-top:14px;width:100%;cursor:pointer;font-size:14px;min-height:40px}
.login-card .btn{margin-top:18px}
.hidden{display:none !important}
.brand{display:flex;align-items:center;gap:10px;font-size:19px}
.brand-logo{height:50px;width:auto}
.login-logo{display:block;width:150px;height:auto;margin:0 auto 8px}
.topbar{flex-wrap:wrap}
.userbox{flex-wrap:wrap;justify-content:flex-end}
#notifyBtn{font-size:13px;min-height:38px;padding:8px 12px}

/* side menu (opens from the hamburger button) */
.topbar{justify-content:flex-start;gap:12px;align-items:center}
.menu-btn{width:44px;height:44px;border-radius:14px;border:0;background:#fff;box-shadow:var(--shadow);display:grid;place-items:center;cursor:pointer;color:var(--navy);padding:0}
.menu-btn .ico{width:22px;height:22px}
.overlay{position:fixed;inset:0;background:rgba(30,25,50,.35);opacity:0;pointer-events:none;transition:opacity .25s;z-index:40}
.overlay.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;bottom:0;right:0;width:min(320px,86vw);background:#fff;z-index:50;transform:translateX(105%);transition:transform .28s ease;box-shadow:-10px 0 30px rgba(60,40,80,.18);border-radius:26px 0 0 26px;padding:22px 18px;display:flex;flex-direction:column;gap:14px;overflow-y:auto}
.drawer.open{transform:translateX(0)}
.drawer-head{display:flex;align-items:center;justify-content:space-between}
.avatar{width:58px;height:58px;border-radius:50%;background:linear-gradient(135deg,#f9c3ac,#e8789f);color:#fff;display:grid;place-items:center;font-size:24px;font-weight:800}
.close-btn{background:#f6f1f4;border:0;width:40px;height:40px;border-radius:12px;font-size:16px;cursor:pointer;color:var(--navy)}
.drawer-name{font-size:18px;font-weight:800;color:var(--navy)}
.drawer-rows{background:#faf6f8;border-radius:18px;padding:4px 14px}
.drawer-rows .row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid #efe6ea;font-size:14px}
.drawer-rows .row:last-child{border-bottom:0}
.drawer-rows .row span{color:var(--muted)}
.drawer-rows .row b{color:var(--navy);direction:ltr;text-align:left;word-break:break-all}
.drawer .btn{width:100%}
.logout-btn{margin-top:auto;background:#fdeaea;color:var(--red)}
.menu-title{font-size:13px;font-weight:800;color:var(--muted);margin-top:4px}
.menu-list{display:flex;flex-direction:column;gap:8px}
.menu-item{display:flex;align-items:center;gap:12px;border:0;background:#faf6f8;border-radius:16px;padding:10px 12px;cursor:pointer;color:var(--navy);font-weight:700;font-size:15px;text-align:right;min-height:52px;width:100%}
.menu-item .ico-wrap{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:#fff;color:var(--navy);flex:0 0 auto}
.menu-item .ico{width:20px;height:20px}
.menu-item.active{background:var(--navy);color:#fff}
.menu-item.active .ico-wrap{background:rgba(255,255,255,.18);color:#fff}
main{padding-bottom:40px}
.mix-cols{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:start}
.mix-cols .card{margin:0;padding:12px}
.mix-cols .card h3{font-size:15px}
.mix-cols .bagsRow{grid-template-columns:1fr;gap:6px}
.mix-cols input,.mix-cols select{font-size:14px;padding:10px 10px;min-height:42px}
.mix-cols .mixRow{padding:10px;margin-top:8px}
.mix-cols .btn{font-size:13px;padding:8px 10px;width:100%}
.bagsRow{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mixRow{background:#faf6f8;border-radius:16px;padding:12px;margin-top:10px;display:flex;flex-direction:column;gap:8px}
.rowTotal{font-size:13px;font-weight:700;color:var(--navy)}
</style>
</head>
<body>

<!-- Login screen -->
<div id="loginView" class="login-wrap hidden">
  <div class="login-card">
    <img class="login-logo" src="logo.png" alt="أبراج الأهرام">
    <h1>معمل البلاستيك</h1>
    <div class="sub" id="authSub">سجّل دخولك للمتابعة</div>
    <form id="loginForm">
      <div id="signupName" class="hidden">
        <label for="suName">الاسم الكامل</label>
        <input id="suName" autocomplete="name">
      </div>
      <div id="signupPhone" class="hidden">
        <label for="suPhone">رقم الهاتف</label>
        <input id="suPhone" type="tel" inputmode="tel" autocomplete="tel" dir="ltr">
      </div>
      <label for="loginEmail">البريد الإلكتروني</label>
      <input id="loginEmail" type="email" autocomplete="username" required dir="ltr">
      <label for="loginPass">كلمة المرور</label>
      <input id="loginPass" type="password" autocomplete="current-password" required dir="ltr" minlength="6">
      <div id="signupConfirm" class="hidden">
        <label for="suPass2">تأكيد كلمة المرور</label>
        <input id="suPass2" type="password" autocomplete="new-password" dir="ltr" minlength="6">
      </div>
      <button id="loginBtn" class="btn btn-primary" type="submit">دخول</button>
      <div id="loginMsg" class="msg err"></div>
    </form>
    <button id="authToggle" class="link-btn" type="button">ما عندك حساب؟ أنشئي حساب جديد</button>
  </div>
</div>

<!-- App shell -->
<div id="appView" class="hidden">
  <header class="topbar">
    <button id="menuBtn" class="menu-btn" type="button" aria-label="القائمة">
      <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
    <div class="brand"><img class="brand-logo" src="logo.png" alt="أبراج الأهرام">
      <div>معمل البلاستيك</div></div>
  </header>

  <div id="overlay" class="overlay"></div>
  <aside id="drawer" class="drawer" aria-label="القائمة">
    <div class="drawer-head">
      <div class="avatar" id="avatar"></div>
      <button id="closeMenuBtn" class="close-btn" type="button" aria-label="إغلاق">✕</button>
    </div>
    <div class="drawer-name" id="userName"></div>
    <div class="drawer-rows">
      <div class="row"><span>رقم الهاتف</span><b id="drawerPhone"></b></div>
    </div>
    <button id="notifyBtn" class="btn btn-gold" type="button">تفعيل الإشعارات</button>
    <div class="menu-title">الأقسام</div>
    <nav id="menuList" class="menu-list" aria-label="الأقسام"></nav>
    <button id="logoutBtn" class="btn logout-btn" type="button">تسجيل خروج</button>
  </aside>
  <main id="page"></main>
</div>

<!-- Loading -->
<div id="loadingView" class="loading">جاري التحميل...</div>

<script>
/* ===== 1. Config ===== */

  { id: 'users',      label: 'المستخدمون',      roles: ['admin'],                      stage: 1, desc: '' },

/* Line icons (24x24, stroke). Used in the bottom bar and the home tiles. */
const ICONS = {

  molds: '<path d="M12 3l9 5-9 5-9-5z"/><path d="M3 13l9 5 9-5"/>',

const icon = id => `<svg class="ico" viewBox="0 0 24 24" aria-hidden="true">${ICONS[id] || ''}</svg>`;

/* ===== 2. State ===== */
const state = { profile: null, page: null };

/* ===== 3. Helpers ===== */
function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function show(id, on) { document.getElementById(id).classList.toggle('hidden', !on); }
function allowedPages(role) { return PAGES.filter(p => p.roles.includes(role)); }

/* ===== 4. Auth ===== */
/* Login and sign-up share one form. authMode switches between them. */
state.authMode = 'login';
function setAuthMode(mode) {
  state.authMode = mode;
  const signup = mode === 'signup';
  show('signupName', signup); show('signupPhone', signup); show('signupConfirm', signup);
  document.getElementById('suName').required = signup;
  document.getElementById('suPhone').required = signup;
  document.getElementById('suPass2').required = signup;
  document.getElementById('loginPass').autocomplete = signup ? 'new-password' : 'current-password';
  document.getElementById('authSub').textContent = signup ? 'أنشئي حسابك ثم انتظري تفعيل المدير' : 'سجّلي دخولك للمتابعة';
  document.getElementById('loginBtn').textContent = signup ? 'إنشاء الحساب' : 'دخول';
  document.getElementById('authToggle').textContent = signup ? 'عندك حساب؟ سجّلي دخولك' : 'ما عندك حساب؟ أنشئي حساب جديد';
  document.getElementById('loginMsg').className = 'msg err';
  document.getElementById('loginMsg').textContent = '';
}
document.getElementById('authToggle').addEventListener('click', () =>
  setAuthMode(state.authMode === 'login' ? 'signup' : 'login'));

// Phone as typed, with Arabic digits converted and spaces or dashes removed
function suPhoneValue() {
  return toEnDigits(document.getElementById('suPhone').value).replace(/[\s-]/g, '');
}

const AUTH_ERRORS = {
  'Invalid login credentials': 'البريد أو كلمة المرور غير صحيحة',
  'User already registered': 'هذا البريد مسجّل من قبل. سجّلي دخولك.',
  'Password should be at least 6 characters.': 'يجب أن تكون كلمة المرور 6 أحرف على الأقل',
  'Unable to validate email address: invalid format': 'صيغة البريد غير صحيحة',
};

document.getElementById('loginForm').addEventListener('submit', async e => {
  e.preventDefault();
  const btn = document.getElementById('loginBtn');
  const msg = document.getElementById('loginMsg');
  const email = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPass').value;
  const signup = state.authMode === 'signup';

  msg.className = 'msg err'; msg.textContent = '';
  if (signup) {
    const name = document.getElementById('suName').value.trim();
    if (!name) { msg.textContent = 'أدخلي اسمك الكامل'; return; }
    if (!/^\+?\d{7,15}$/.test(suPhoneValue())) { msg.textContent = 'أدخلي رقم هاتف صحيح'; return; }
    if (password !== document.getElementById('suPass2').value) { msg.textContent = 'كلمتا المرور غير متطابقتين'; return; }
  }

  btn.disabled = true; btn.textContent = signup ? 'جاري إنشاء الحساب...' : 'جاري الدخول...';
  let error, data;
  if (signup) {
    ({ data, error } = await sb.auth.signUp({
      email, password,
      options: { data: { full_name: document.getElementById('suName').value.trim(), phone: suPhoneValue() } },
    }));
  } else {
    ({ error } = await sb.auth.signInWithPassword({ email, password }));
  }
  btn.disabled = false;
  btn.textContent = signup ? 'إنشاء الحساب' : 'دخول';

  if (error) {
    msg.textContent = AUTH_ERRORS[error.message] || ('تعذّر: ' + error.message);
    return;
  }
  if (signup) {
    if (data && data.session) return; // confirmations are off: onAuthStateChange opens the app
    // confirmations are on: the account exists, the user must confirm by email first
    setAuthMode('login');
    msg.className = 'msg ok';
    msg.textContent = 'تم إنشاء الحساب. أكّدي بريدك من الرسالة اللي وصلتك، ثم سجّلي دخولك.';
  }
});

document.getElementById('logoutBtn').addEventListener('click', async () => {
  await sb.auth.signOut();
});

async function loadProfile(userId) {
  const { data, error } = await sb.from('profiles').select('id, full_name, email, role, phone').eq('id', userId).maybeSingle();
  if (error) { alert('تعذّر تحميل الحساب: ' + error.message); return null; }
  return data;
}

async function startSession(session) {
  show('loadingView', true); show('loginView', false); show('appView', false);
  const profile = await loadProfile(session.user.id);
  if (!profile || profile.role === 'pending') {
    // new accounts wait here until the admin gives them a role
    document.getElementById('loadingView').innerHTML =
      '<div class="card" style="max-width:420px;margin:40px auto"><h3>حسابك بانتظار التفعيل</h3>' +
      '<p>راجعي المدير حتى يفعّل حسابك ويحدد صلاحياتك. بعد التفعيل سجّلي دخولك مرة ثانية.</p><br><button class="btn btn-primary" onclick="sb.auth.signOut()">خروج</button></div>';
    return;
  }
  state.profile = profile;
  show('loadingView', false); show('appView', true);
  document.getElementById('userName').textContent = profile.full_name || '—';
  document.getElementById('drawerPhone').textContent = profile.phone || '—';
  document.getElementById('avatar').textContent = (profile.full_name || '؟').charAt(0);
  renderShell();
}

function showLogin() {
  state.profile = null;
  show('loadingView', false); show('appView', false); show('loginView', true);
  document.getElementById('loadingView').innerHTML = 'جاري التحميل...';
}

sb.auth.onAuthStateChange((event, session) => {
  if (session) { startSession(session); } else { showLogin(); }
});

/* ===== 5. Shell and navigation ===== */
function renderShell() {
  const pages = allowedPages(state.profile.role);
  if (!pages.find(p => p.id === state.page)) state.page = pages[0]?.id || null;
  document.getElementById('menuList').innerHTML = pages.map(p =>
    `<button class="menu-item ${p.id === state.page ? 'active' : ''}" data-id="${p.id}" type="button">
       <span class="ico-wrap">${icon(p.id)}</span><span>${esc(p.label)}</span></button>`
  ).join('');
  document.querySelectorAll('#menuList .menu-item').forEach(b => b.addEventListener('click', () => {
    state.page = b.dataset.id; closeMenu(); renderShell();
  }));
  renderPage();
}

function renderPageBody(meta) {
  const main = document.getElementById('page');
  if (meta.id === 'home') { renderHome(); return; }
  if (meta.id === 'users') { renderUsers(); return; }
  if (ASSET[meta.id]) { renderAssets(meta.id); return; }
  if (meta.id === 'production') { renderProduction(); return; }
  if (meta.id === 'workers') { renderWorkers(); return; }
  if (meta.id === 'guides') { renderGuides(); return; }
  if (meta.id === 'bags') { renderBags(); return; }
  if (meta.id === 'mixing') { renderMixing(); return; }
  if (meta.id === 'warehouse') { renderWarehouse(); return; }
  main.innerHTML =
    `<div class="page-title">${esc(meta.label)}</div>` +
    `<div class="card"><h3>هذا القسم يُبنى في المرحلة ${meta.stage}</h3>` +
    `<p>${esc(meta.desc)}</p></div>`;
}

function renderPage() {
  const main = document.getElementById('page');
  const meta = PAGES.find(p => p.id === state.page);
  if (!meta) { main.innerHTML = '<div class="empty">لا توجد أقسام متاحة لصلاحيتك.</div>'; return; }
  renderPageBody(meta);
  decorateDates(main);
}

/* Date fields: show the chosen day in Arabic under the picker, so it is never read as MM/DD. */
function fmtDate(dateStr) {
  if (!dateStr) return '';
  const d = new Date(dateStr + 'T12:00:00Z');
  return d.toLocaleDateString('ar-u-nu-latn', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric', timeZone: 'UTC' });
}
function decorateDates(root) {
  root.querySelectorAll('input[type="date"]').forEach(inp => {
    if (inp.nextElementSibling && inp.nextElementSibling.classList.contains('dlabel')) return;
    const label = document.createElement('div');
    label.className = 'dlabel';
    label.textContent = fmtDate(inp.value);
    inp.insertAdjacentElement('afterend', label);
    inp.addEventListener('change', () => { label.textContent = fmtDate(inp.value); });
  });
}
function addDays(dateStr, n) {
  const d = new Date(dateStr + 'T12:00:00Z');
  d.setUTCDate(d.getUTCDate() + n);
  return d.toISOString().slice(0, 10);
}

/* ===== 5b. Home dashboard ===== */
async function renderHome() {
  const main = document.getElementById('page');
  const today = todayBaghdad();
  const from = addDays(today, -13);
  const firstName = (state.profile.full_name || '').split(' ')[0];
  main.innerHTML = `
    <div class="hero">
      <small>${esc(fmtDate(today))}</small>
      <h1>${firstName ? 'أهلاً ' + esc(firstName) : 'أهلاً بك'}</h1>
      <div class="big" id="hNet">—</div>
      <div class="big-label">الصافي اليوم (كغم)</div>
    </div>
    <div id="homeBody"><div class="loading">جاري التحميل...</div></div>`;

  const [prodRes, matRes, machRes] = await Promise.all([
    sb.from('production_net').select('entry_date, shift, machine_id, produced_qty, waste_qty').gte('entry_date', from),
    sb.from('material_movements').select('move_date, qty_out, materials(name, kind)').eq('source', 'خبط').gte('move_date', from),
    sb.from('machines').select('id, name'),
  ]);
  const body = document.getElementById('homeBody');
  if (prodRes.error || matRes.error || machRes.error) {
    body.innerHTML = `<p>تعذّر التحميل: ${esc((prodRes.error || matRes.error || machRes.error).message)}</p>`;
    return;
  }
  const machName = Object.fromEntries(machRes.data.map(m => [m.id, m.name]));
  const net = r => (Number(r.produced_qty) || 0) - (Number(r.waste_qty) || 0);
  const fmt = n => Number(n || 0).toLocaleString('en', { maximumFractionDigits: 3 });

  // Group everything by day
  const byDay = {};
  const day = d => byDay[d] || (byDay[d] = { net: 0, waste: 0, mix: 0, shifts: 0 });
  prodRes.data.forEach(r => { const x = day(r.entry_date); x.net += net(r); x.waste += Number(r.waste_qty) || 0; x.shifts++; });
  matRes.data.forEach(r => { day(r.move_date).mix += Number(r.qty_out) || 0; });

  const t = byDay[today] || { net: 0, waste: 0, mix: 0, shifts: 0 };
  document.getElementById('hNet').textContent = fmt(t.net);

  // Today: shift totals, machines, materials
  const todayRows = prodRes.data.filter(r => r.entry_date === today);
  const shiftTotals = SHIFTS.map(s => ({
    name: s, net: todayRows.filter(r => r.shift === s).reduce((a, r) => a + net(r), 0),
  }));
  const machines = {};
  todayRows.forEach(r => {
    const m = machines[r.machine_id] || (machines[r.machine_id] = { produced: 0, waste: 0 });
    m.produced += Number(r.produced_qty) || 0; m.waste += Number(r.waste_qty) || 0;
  });
  const mats = {};
  matRes.data.filter(r => r.move_date === today).forEach(r => {
    const key = (r.materials?.name || '—') + ' (' + (r.materials?.kind || '') + ')';
    mats[key] = (mats[key] || 0) + (Number(r.qty_out) || 0);
  });

  const machineCards = Object.entries(machines).map(([id, m]) => {
    const n = m.produced - m.waste;
    const pct = Math.max(0, Math.min(100, m.produced ? (n / m.produced) * 100 : 0));
    return `<div class="mach"><b>${esc(machName[id] || '—')}</b>
      <div class="val">${fmt(n)}</div><div class="sub2">إنتاج ${fmt(m.produced)} · تلف ${fmt(m.waste)}</div>
      <div class="bar"><i style="width:${pct.toFixed(0)}%"></i></div></div>`;
  }).join('') || '<div class="empty" style="grid-column:1/-1">لا توجد شفتات مسجلة اليوم.</div>';

  const matRows = Object.entries(mats).sort((a, b) => b[1] - a[1]).map(([k, v]) =>
    `<div style="display:flex;justify-content:space-between;padding:8px 2px;border-bottom:1px solid #f3eaee">
       <span>${esc(k)}</span><b>${fmt(v)} كغم</b></div>`).join('')
    || '<div class="empty">لا توجد مواد مخبوطة اليوم.</div>';

  // History: newest day first
  const days = Object.keys(byDay).sort((a, b) => b.localeCompare(a));
  const histRows = days.map(d => {
    const x = byDay[d];
    return `<tr>
      <td><b>${esc(fmtDate(d))}</b></td>
      <td>${fmt(x.net)}</td>
      <td>${fmt(x.waste)}</td>
      <td>${fmt(x.mix)}</td>
    </tr>`;
  }).join('');

  body.innerHTML = `
    <div class="tiles">
      <div class="tile"><div class="ico-circle tone-1">${icon('production')}</div><b>${fmt(t.net)}</b><span>الصافي اليوم (كغم)</span></div>
      <div class="tile"><div class="ico-circle tone-2">${icon('warehouse')}</div><b>${fmt(t.waste)}</b><span>التلف اليوم (كغم)</span></div>
      <div class="tile"><div class="ico-circle tone-3">${icon('mixing')}</div><b>${fmt(t.mix)}</b><span>المخبوط اليوم (كغم)</span></div>
      <div class="tile"><div class="ico-circle tone-4">${icon('machines')}</div><b>${t.shifts}</b><span>شفتات مسجلة اليوم</span></div>
    </div>

    <div class="section-title">شفتات اليوم</div>
    <div class="mach-grid">
      ${shiftTotals.map(s => `<div class="mach"><b>${esc(s.name)}</b><div class="val">${fmt(s.net)}</div><div class="sub2">كغم صافي</div></div>`).join('')}
    </div>

    <div class="section-title">المكائن اليوم</div>
    <div class="mach-grid">${machineCards}</div>

    <div class="section-title">المواد المخبوطة اليوم</div>
    <div class="card" style="padding:12px 16px">${matRows}</div>

    <div class="section-title">السجل (آخر 14 يوم، الأحدث أولاً)</div>
    <div class="table-wrap">${days.length ? `<table class="hist">
      <thead><tr><th>التاريخ</th><th>الصافي</th><th>التلف</th><th>الخبط</th></tr></thead>
      <tbody>${histRows}</tbody></table>` : '<div class="empty">لا توجد بيانات بعد.</div>'}</div>`;
}

/* ===== 6b. Machines and molds (stage 2) ===== */
const ASSET = {
  machines: { table: 'machines', title: 'المكائن', single: 'مكينة', nameLabel: 'اسم المكينة' },
  molds:    { table: 'molds',    title: 'القوالب', single: 'قالب',   nameLabel: 'اسم القالب' },
};
const PRODUCT_TYPES = ['مبردة', 'غسالة', 'تدفئة'];
const BUCKET = 'plastic-images';
const MAX_PHOTO_MB = 5;

function canEdit() { return ['admin', 'supervisor'].includes(state.profile.role); }

async function renderAssets(kind) {
  const cfg = ASSET[kind];
  const main = document.getElementById('page');
  const extraField = kind === 'machines'
    ? '<label for="assetDetails">تفاصيل المكينة</label><textarea id="assetDetails" rows="3"></textarea>'
    : '<label>المنتجات اللي يسويها القالب</label><div class="checks">' +
      PRODUCT_TYPES.map(t => `<label class="check"><input type="checkbox" name="ptype" value="${t}"> ${t}</label>`).join('') +
      '</div>';

  main.innerHTML =
    `<div class="page-title">${cfg.title}</div>` +
    (canEdit() ? `<div class="card"><h3>إضافة ${cfg.single}</h3>
      <form id="assetForm">
        <label for="assetName">${cfg.nameLabel}</label>
        <input id="assetName" maxlength="120">
        ${extraField}
        <label for="assetPhoto">صورة (اختيارية، أقصى حجم ${MAX_PHOTO_MB} ميغا)</label>
        <input id="assetPhoto" type="file" accept="image/*">
        <button id="assetSave" class="btn btn-primary" type="submit" style="margin-top:16px;width:100%">حفظ</button>
        <div id="assetMsg" class="msg"></div>
      </form></div>` : '') +
    '<div id="assetList"><div class="loading">جاري التحميل...</div></div>';

  if (canEdit()) document.getElementById('assetForm').addEventListener('submit', e => saveAsset(e, kind));
  loadAssetList(kind);
}

async function saveAsset(e, kind) {
  e.preventDefault();
  const cfg = ASSET[kind];
  const btn = document.getElementById('assetSave');
  const msg = document.getElementById('assetMsg');
  const name = document.getElementById('assetName').value.trim();
  const file = document.getElementById('assetPhoto').files[0];
  msg.className = 'msg'; msg.textContent = '';

  if (!name) { msg.className = 'msg err'; msg.textContent = 'أدخلي الاسم أولاً'; return; }
  if (file && file.size > MAX_PHOTO_MB * 1024 * 1024) {
    msg.className = 'msg err'; msg.textContent = `الصورة أكبر من ${MAX_PHOTO_MB} ميغا`; return;
  }

  btn.disabled = true; btn.textContent = 'جاري الحفظ...';
  try {
    let photo_url = null;
    if (file) {
      const ext = ((file.name.split('.').pop() || 'jpg').toLowerCase().replace(/[^a-z0-9]/g, '')) || 'jpg';
      const path = `${kind}/${Date.now()}-${Math.random().toString(36).slice(2, 8)}.${ext}`;
      const up = await sb.storage.from(BUCKET).upload(path, file, { contentType: file.type });
      if (up.error) throw up.error;
      photo_url = sb.storage.from(BUCKET).getPublicUrl(path).data.publicUrl;
    }

    const row = { name, photo_url };
    if (kind === 'machines') {
      row.details = document.getElementById('assetDetails').value.trim();
    } else {
      row.product_types = [...document.querySelectorAll('input[name="ptype"]:checked')].map(c => c.value);
    }

    const { error } = await sb.from(cfg.table).insert(row);
    if (error) throw error;

    e.target.reset();
    msg.className = 'msg ok'; msg.textContent = 'تم الحفظ';
    loadAssetList(kind);
  } catch (err) {
    msg.className = 'msg err'; msg.textContent = 'تعذّر الحفظ: ' + (err.message || err);
  } finally {
    btn.disabled = false; btn.textContent = 'حفظ';
  }
}

async function loadAssetList(kind) {
  const cfg = ASSET[kind];
  const list = document.getElementById('assetList');
  const { data, error } = await sb.from(cfg.table).select('*').order('created_at', { ascending: false });
  if (error) { list.innerHTML = `<div class="card"><p>تعذّر التحميل: ${esc(error.message)}</p></div>`; return; }
  if (!data.length) { list.innerHTML = `<div class="empty">لا توجد ${cfg.title} بعد.</div>`; return; }

  list.innerHTML = data.map(item => {
    const photo = item.photo_url
      ? `<img src="${esc(item.photo_url)}" alt="" loading="lazy" style="width:100%;height:160px;object-fit:cover;border-radius:10px;margin-bottom:10px">`
      : '';
    const sub = kind === 'machines'
      ? `<p>${esc(item.details || 'بدون تفاصيل')}</p>`
      : `<div>${(item.product_types || []).map(t => `<span class="badge badge-gold" style="margin:2px">${esc(t)}</span>`).join(' ') || '<p>بدون نوع منتج</p>'}</div>`;
    const del = canEdit()
      ? `<button class="btn" data-del="${esc(item.id)}" style="margin-top:10px;width:100%;background:var(--red-light);color:var(--red)">حذف</button>`
      : '';
    return `<div class="card">${photo}<h3>${esc(item.name)}</h3>${sub}${del}</div>`;
  }).join('');

function todayBaghdad() {
  return new Date().toLocaleDateString('en-CA', { timeZone: 'Asia/Baghdad' }); // YYYY-MM-DD
}
// Arabic-Indic and Persian digits -> English digits
function toEnDigits(s) {
  return String(s ?? '')
    .replace(/[٠-٩]/g, d => d.charCodeAt(0) - 0x0660)
    .replace(/[۰-۹]/g, d => d.charCodeAt(0) - 0x06F0);
}
function toInt(v) {
  const s = toEnDigits(v).trim();
  return s === '' ? NaN : Number(s);
}

async function loadProductionList() {
  const date = document.getElementById('pFilterDate').value;
  const list = document.getElementById('pList');
  const summary = document.getElementById('pSummary');
  const { data, error } = await sb.from('production_net').select('*')
    .eq('entry_date', date).order('shift_order').order('created_at');
  if (error) { list.innerHTML = `<p>تعذّر التحميل: ${esc(error.message)}</p>`; return; }
  if (!data.length) {
    summary.innerHTML = '';
    list.innerHTML = '<div class="empty">لا توجد شفتات مسجلة بهذا اليوم.</div>';
    return;
  }

  const L = state.lookup || { machines: {}, molds: {} };
  const canEdit = ['admin', 'supervisor'].includes(state.profile.role);

  // Per-machine totals for the day
  const perMachine = {};
  data.forEach(r => {
    const p = perMachine[r.machine_id] || (perMachine[r.machine_id] = { produced: 0, waste: 0 });
    p.produced += r.produced_qty ?? 0;
    p.waste += r.waste_qty;
  });
  summary.innerHTML = '<div class="sum-grid">' + Object.entries(perMachine).map(([mid, t]) =>
    `<div class="sum-box"><b>${esc(L.machines[mid] || '—')}</b>
      <span>الصافي: ${(t.produced - t.waste).toLocaleString('en')}</span>
      <div style="font-size:12px;opacity:.85;margin-top:4px">إنتاج ${t.produced.toLocaleString('en')} · تلف ${t.waste.toLocaleString('en')}</div></div>`
  ).join('') + '</div>';

  const rows = data.map(r => {
    const produced = r.produced_qty;
    const good = produced == null ? null : produced - r.waste_qty;
    const cls = produced != null && produced < 0 ? 'neg' : '';
    const fmt = v => v == null ? '<span style="color:var(--muted)">أول قراءة</span>' : `<span class="${cls}">${Number(v).toLocaleString('en')}</span>`;
    const del = canEdit ? `<button class="trash" data-del="${esc(r.id)}">حذف</button>` : '';
    return `<tr>
      <td>${esc(r.shift)}</td>
      <td>${esc(L.machines[r.machine_id] || '—')}</td>
      <td>${esc(L.molds[r.mold_id] || '—')}</td>
      <td>${Number(r.meter_reading).toLocaleString('en')}</td>
      <td>${fmt(produced)}</td>
      <td>${Number(r.waste_qty).toLocaleString('en')}</td>
      <td>${fmt(good)}</td>
      <td>${esc(r.worker_name || '—')}</td>
      <td>${del}</td></tr>`;
  }).join('');

  list.innerHTML = `<div class="table-wrap"><table>
    <thead><tr><th>الشفتة</th><th>المكينة</th><th>القالب</th><th>القراءة</th>
      <th>الإنتاج</th><th>التلف</th><th>الصافي</th><th>العامل</th><th></th></tr></thead>
    <tbody>${rows}</tbody></table></div>`;

  list.querySelectorAll('[data-del]').forEach(b => b.addEventListener('click', () => deleteProduction(b.dataset.del)));
}

// Week starts on Saturday. dateStr is YYYY-MM-DD; returns the Saturday of its week.
function weekStartOf(dateStr) {
  const d = new Date(dateStr + 'T00:00:00Z');
  const back = (d.getUTCDay() + 1) % 7;
  return new Date(d.getTime() - back * 86400000).toISOString().slice(0, 10);
}

// Turns a YouTube link into an embedded player; other links open normally
function videoBlock(url) {
  const yt = url.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|shorts\/))([\w-]{11})/);
  if (yt) {
    return `<iframe src="https://www.youtube.com/embed/${yt[1]}" style="width:100%;aspect-ratio:16/9;border:0;border-radius:10px" allowfullscreen loading="lazy"></iframe>`;
  }
  if (url.includes('/storage/v1/object/public/plastic-videos/')) {
    return `<video controls preload="none" src="${esc(url)}" style="width:100%;border-radius:10px"></video>`;
  }
  return `<a href="${esc(url)}" target="_blank" rel="noopener">فتح الرابط</a>`;
}

async function saveGuide(e) {
  e.preventDefault();
  const btn = document.getElementById('gSave');
  const msg = document.getElementById('gMsg');
  const title = document.getElementById('gTitle').value.trim();
  const link = document.getElementById('gLink').value.trim();

  msg.className = 'msg'; msg.textContent = '';

  if (!link && !file) { msg.className = 'msg err'; msg.textContent = 'ضيفي رابط أو ارفعي فيديو'; return; }
  if (link && !/^https?:\/\//i.test(link)) { msg.className = 'msg err'; msg.textContent = 'يجب أن يبدأ الرابط بـ https://'; return; }
  if (file && file.size > GUIDE_VIDEO_MB * 1024 * 1024) { msg.className = 'msg err'; msg.textContent = `الفيديو أكبر من ${GUIDE_VIDEO_MB} ميغا`; return; }

  btn.disabled = true; btn.textContent = 'جاري الحفظ...';
  try {
    let video_url = link;
    if (file) {
      const ext = ((file.name.split('.').pop() || 'mp4').toLowerCase().replace(/[^a-z0-9]/g, '')) || 'mp4';
      const path = `guides/${Date.now()}-${Math.random().toString(36).slice(2, 8)}.${ext}`;
      const up = await sb.storage.from('plastic-videos').upload(path, file, { contentType: file.type });
      if (up.error) throw up.error;
      video_url = sb.storage.from('plastic-videos').getPublicUrl(path).data.publicUrl;
    }
    const { error } = await sb.from('guides').insert({
      title,
      category: document.getElementById('gCat').value,
      mold_id: document.getElementById('gMold').value || null,
      video_url,
    });
    if (error) throw error;
    e.target.reset();
    msg.className = 'msg ok'; msg.textContent = 'تم حفظ الشرح';
    loadGuides();
  } catch (err) {
    msg.className = 'msg err'; msg.textContent = 'تعذّر الحفظ: ' + (err.message || err);
  } finally {
    btn.disabled = false; btn.textContent = 'حفظ الشرح';
  }
}

/* ===== 6d. Mixing and warehouse (stage 5) =====
   Materials are granules (حبيبات), pigments (أصباغ), or recycled plastic (معاد تدويره).
   Quantities are in kg. A mix is saved by the create_mix_batch function, which
   deducts each material from stock in the same transaction. */
const MATERIAL_KINDS = ['حبيبات', 'أصباغ', 'التقوية'];

function setMsg(el, text, kind = 'err') {
  el.className = 'msg ' + kind;
  el.textContent = text;
}
function parseQty(v) {
  const n = Number(toEnDigits(v).trim().replace(',', '.'));
  return Number.isFinite(n) ? n : NaN;
}
function fmtKg(n) { return Number(n || 0).toLocaleString('en', { maximumFractionDigits: 3 }); }

async function loadStock() {
  const { data, error } = await sb.from('materials_stock')
    .select('id, name, kind, stock_kg').order('kind').order('name');
  if (error) throw error;
  return data;
}

function materialOptions(list) {
  return '<option value="">— اختاري المادة —</option>' + list.map(m =>
    `<option value="${esc(m.id)}">${esc(m.name)} (${esc(m.kind)}) — متوفر ${fmtKg(m.stock_kg)} كغم</option>`
  ).join('');
}

/* ---- Mixing page ----
   Granules and pigments: each line is type + number of bags + weight per bag -> kg.
   Reinforcement (التقوية): each line is a warehouse material + kg, deducted from stock. */
function mixRowHTML(mode, kind) {
  const opts = materialOptions((state.stock || []).filter(m => m.kind === kind));
  const fields = mode === 'bags'
    ? `<div class="bagsRow">
         <input class="mxBags" inputmode="numeric" placeholder="عدد الكياس" autocomplete="off" aria-label="عدد الكياس">
         <input class="mxBagW" inputmode="decimal" placeholder="وزن الكيس (كغم)" autocomplete="off" aria-label="وزن الكيس بالكيلوغرام">
       </div>`
    : `<input class="mxKg" inputmode="decimal" placeholder="الكمية (كغم)" autocomplete="off" aria-label="الكمية بالكيلوغرام">`;
  return `<div class="mixRow" data-mode="${mode}">
      <select class="mxMat" aria-label="${esc(kind)}">${opts}</select>
      ${fields}
      <div class="rowTotal">الإجمالي: 0 كغم</div>
      <button class="trash" type="button">حذف السطر</button>
    </div>`;
}

// kg for one line, or NaN when the line is not complete
function mixRowKg(row) {
  if (row.dataset.mode === 'bags') {
    const bags = toInt(row.querySelector('.mxBags').value);
    const w = parseQty(row.querySelector('.mxBagW').value);
    return (Number.isInteger(bags) && bags > 0 && w > 0) ? bags * w : NaN;
  }
  const kg = parseQty(row.querySelector('.mxKg').value);
  return kg > 0 ? kg : NaN;
}

function refreshMixTotals() {
  let grand = 0;
  document.querySelectorAll('#mixForm .mixRow').forEach(row => {
    const kg = mixRowKg(row);
    row.querySelector('.rowTotal').textContent =
      'الإجمالي: ' + (Number.isFinite(kg) ? fmtKg(kg) : '—') + ' كغم';
    if (Number.isFinite(kg)) grand += kg;
  });
  document.getElementById('mxGrand').innerHTML = `<b>إجمالي الخبطة</b><span>${fmtKg(grand)} كغم</span>`;
}

function addMixRow(boxId, kind, mode) {
  const wrap = document.createElement('div');
  wrap.innerHTML = mixRowHTML(mode, kind);
  const row = wrap.firstElementChild;
  row.querySelector('.trash').addEventListener('click', () => { row.remove(); refreshMixTotals(); });
  document.getElementById(boxId).appendChild(row);
  refreshMixTotals();
}

function resetMixRows() {
  ['grRows', 'pgRows', 'tqRows'].forEach(id => { document.getElementById(id).innerHTML = ''; });
  addMixRow('grRows', 'حبيبات', 'bags');
  addMixRow('pgRows', 'أصباغ', 'bags');
  addMixRow('tqRows', 'التقوية', 'kg');
}

async function renderMixing() {
  const main = document.getElementById('page');
  main.innerHTML = `
    <div class="page-title">الخبط</div>
    <div class="card">
      <div class="grid2">
        <div><label for="mxDate">التاريخ</label>
          <input id="mxDate" type="date" value="${todayBaghdad()}" lang="en" dir="ltr" required></div>
        <div><label for="mxWorker">اسم العامل</label><input id="mxWorker"></div>
      </div>
    </div>
    <form id="mixForm">
      <div class="mix-cols">

          <h3>الحبيبات</h3>

        </div>
        <div class="card">
          <h3>الأصباغ</h3>
          <div id="pgRows"></div>
          <button id="pgAdd" class="btn btn-gold" type="button" style="margin-top:10px">+ إضافة صبغ</button>
        </div>
      </div>

        <h3>التقوية</h3>
        <div id="tqRows"></div>

    </form>
    <div class="card"><h3>آخر الخبطات</h3><div id="mxList"><div class="loading">جاري التحميل...</div></div></div>`;

  try { state.stock = await loadStock(); }
  catch (err) { setMsg(document.getElementById('mxMsg'), 'تعذّر تحميل المخزن: ' + err.message); return; }
  if (!state.stock.length) {
    setMsg(document.getElementById('mxMsg'), 'لا توجد مواد بالمخزن بعد. أضيفيها من قسم مخزن الحبيبات أولاً.');
  }

  document.getElementById('grAdd').addEventListener('click', () => addMixRow('grRows', 'حبيبات', 'bags'));
  document.getElementById('pgAdd').addEventListener('click', () => addMixRow('pgRows', 'أصباغ', 'bags'));
  document.getElementById('tqAdd').addEventListener('click', () => addMixRow('tqRows', 'التقوية', 'kg'));
  const form = document.getElementById('mixForm');
  form.addEventListener('submit', saveMix);
  form.addEventListener('input', refreshMixTotals);

async function saveMix(e) {
  e.preventDefault();
  const btn = document.getElementById('mxSave');
  const msg = document.getElementById('mxMsg');
  setMsg(msg, '', '');

  const rows = [...document.querySelectorAll('#grRows .mixRow, #pgRows .mixRow, #tqRows .mixRow')];

  const items = [];
  for (const row of rows) {
    const mid = row.querySelector('.mxMat').value;
    const filled = mid || [...row.querySelectorAll('input')].some(i => i.value.trim() !== '');
    if (!filled) continue; // empty line, skip it
    const kg = mixRowKg(row);
    if (!mid || !Number.isFinite(kg)) {
      setMsg(msg, 'أكملي بيانات كل سطر: المادة وعدد الكياس ووزن الكيس، أو المادة والكمية بالكيلوغرام');
      return;
    }
    items.push({ material_id: mid, qty: Math.round(kg * 1000) / 1000 });
  }
  if (!items.length) { setMsg(msg, 'أضيفي مادة واحدة على الأقل'); return; }

  const worker = document.getElementById('mxWorker').value.trim();
  btn.disabled = true; btn.textContent = 'جاري الحفظ...';
  const { error } = await sb.rpc('create_mix_batch', {
    p_date: document.getElementById('mxDate').value,
    p_worker: worker,
    p_note: document.getElementById('mxNote').value.trim(),
    p_items: items,
  });
  btn.disabled = false; btn.textContent = 'حفظ الخبطة';

  if (error) { setMsg(msg, error.message || 'تعذّر الحفظ'); return; }

  try { state.stock = await loadStock(); } catch (_) { /* options keep old values */ }
  document.getElementById('mxNote').value = '';
  resetMixRows();
  setMsg(msg, 'تم تسجيل الخبطة وخصم المواد من المخزن', 'ok');
  notifyStaff('خبطة جديدة', (worker || 'بدون اسم عامل') + ' — ' + items.length + ' مواد');
  loadBatchList();
}

async function loadBatchList() {
  const box = document.getElementById('mxList');
  if (!box) return;
  const { data, error } = await sb.from('mix_batches')
    .select('id, batch_date, worker_name, note, created_at, material_movements(qty_out, materials(name, kind))')
    .order('batch_date', { ascending: false })
    .order('created_at', { ascending: false })
    .limit(30);
  if (error) { box.innerHTML = `<p>تعذّر التحميل: ${esc(error.message)}</p>`; return; }
  if (!data.length) { box.innerHTML = '<div class="empty">لا توجد خبطات مسجلة بعد.</div>'; return; }

  box.innerHTML = data.map(b => {
    const lines = (b.material_movements || []).map(mv =>
      `<li>${esc(mv.materials?.name || '—')} (${esc(mv.materials?.kind || '')}): ${fmtKg(mv.qty_out)} كغم</li>`
    ).join('');
    return `<div style="padding:10px 0;border-bottom:1px solid rgba(0,0,0,.08)">
      <div><b>${esc(b.batch_date)}</b> — ${esc(b.worker_name || 'بدون اسم عامل')}</div>
      <ul style="margin:6px 0 0;padding-inline-start:18px">${lines}</ul>
      ${b.note ? `<div class="hint">${esc(b.note)}</div>` : ''}
      ${canEdit() ? `<button class="trash" data-del="${esc(b.id)}" type="button">حذف الخبطة وإرجاع المواد</button>` : ''}
    </div>`;
  }).join('');
  box.querySelectorAll('[data-del]').forEach(btn =>
    btn.addEventListener('click', () => deleteBatch(btn.dataset.del)));
}

async function deleteBatch(id) {
  if (!confirm('حذف هذه الخبطة؟ المواد بترجع للمخزن.')) return;
  // select() after delete: RLS can block the delete silently, so check that a row was removed
  const { data, error } = await sb.from('mix_batches').delete().eq('id', id).select('id');
  if (error) { alert('تعذّر الحذف: ' + error.message); return; }
  if (!data || !data.length) { alert('لم يتم الحذف. تأكدي من صلاحيتك للحذف.'); return; }
  loadBatchList();
}

/* ---- Warehouse page (admin and supervisor) ---- */
async function renderWarehouse() {
  const main = document.getElementById('page');
  main.innerHTML = `
    <div class="page-title">مخزن الحبيبات والأصباغ</div>
    <div class="card"><h3>إضافة مادة جديدة</h3>
      <form id="matForm">
        <div class="grid2">
          <div><label for="mName">اسم المادة</label><input id="mName" placeholder="مثال: PP أبيض"></div>
          <div><label for="mKind">النوع</label>
            <select id="mKind">${MATERIAL_KINDS.map(k => `<option>${k}</option>`).join('')}</select></div>
        </div>
        <button class="btn btn-primary" type="submit" style="margin-top:12px;width:100%">إضافة المادة</button>
        <div id="matMsg" class="msg"></div>
      </form>
    </div>
    <div class="card"><h3>استلام وارد</h3>
      <form id="inForm">
        <div class="grid2">
          <div><label for="inMat">المادة</label><select id="inMat"></select></div>
          <div><label for="inQty">الكمية الواردة (كغم)</label><input id="inQty" inputmode="decimal" autocomplete="off"></div>
          <div><label for="inDate">التاريخ</label>
            <input id="inDate" type="date" value="${todayBaghdad()}" lang="en" dir="ltr" required></div>
          <div><label for="inNote">ملاحظة (اختياري)</label><input id="inNote"></div>
        </div>
        <button class="btn btn-primary" type="submit" style="margin-top:12px;width:100%">تسجيل الوارد</button>
        <div id="inMsg" class="msg"></div>
      </form>
    </div>
    <div class="card"><h3>الرصيد الحالي</h3><div id="stockList"><div class="loading">جاري التحميل...</div></div></div>`;

  document.getElementById('matForm').addEventListener('submit', async e => {
    e.preventDefault();
    const form = e.target;
    const msg = document.getElementById('matMsg');
    const name = document.getElementById('mName').value.trim();
    if (!name) { setMsg(msg, 'أدخلي اسم المادة'); return; }
    const { error } = await sb.from('materials').insert({ name, kind: document.getElementById('mKind').value });
    if (error) {
      setMsg(msg, error.code === '23505' ? 'هذه المادة موجودة بنفس النوع' : 'تعذّر الحفظ: ' + error.message);
      return;
    }
    form.reset();
    setMsg(msg, 'تمت إضافة المادة', 'ok');
    refreshWarehouse();
  });

  document.getElementById('inForm').addEventListener('submit', async e => {
    e.preventDefault();
    const form = e.target;
    const msg = document.getElementById('inMsg');
    const mid = document.getElementById('inMat').value;
    const qty = parseQty(document.getElementById('inQty').value);
    if (!mid) { setMsg(msg, 'اختاري المادة'); return; }
    if (!(qty > 0)) { setMsg(msg, 'أدخلي الكمية كرقم أكبر من صفر'); return; }
    const { error } = await sb.from('material_movements').insert({
      material_id: mid,
      move_date: document.getElementById('inDate').value,
      qty_in: qty,
      qty_out: 0,
      source: 'وارد',
      note: document.getElementById('inNote').value.trim(),
    });
    if (error) { setMsg(msg, 'تعذّر الحفظ: ' + error.message); return; }
    document.getElementById('inQty').value = '';
    document.getElementById('inNote').value = '';
    setMsg(msg, 'تم تسجيل الوارد', 'ok');
    refreshWarehouse();
  });

  refreshWarehouse();
}

async function refreshWarehouse() {
  const box = document.getElementById('stockList');
  let list;
  try { list = await loadStock(); }
  catch (err) { box.innerHTML = `<p>تعذّر التحميل: ${esc(err.message)}</p>`; return; }
  state.stock = list;

  const sel = document.getElementById('inMat');
  const prev = sel.value;
  sel.innerHTML = materialOptions(list);
  sel.value = prev;

  if (!list.length) { box.innerHTML = '<div class="empty">لا توجد مواد بعد. أضيفي مادة من الأعلى.</div>'; return; }
  box.innerHTML = `<div class="table-wrap"><table>
    <thead><tr><th>المادة</th><th>النوع</th><th>الرصيد (كغم)</th></tr></thead>
    <tbody>${list.map(m => `<tr>
      <td>${esc(m.name)}</td><td>${esc(m.kind)}</td>
      <td class="${Number(m.stock_kg) < 0 ? 'neg' : ''}">${fmtKg(m.stock_kg)}</td>
    </tr>`).join('')}</tbody></table></div>`;
}

/* ===== 6e. Notifications (Web Push) =====
   Each device subscribes once; the notify Edge Function sends to all subscribed devices. */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
function notifySupported() {
  return 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;
}
function b64ToBytes(b64) {
  const s = (b64 + '='.repeat((4 - b64.length % 4) % 4)).replace(/-/g, '+').replace(/_/g, '/');
  return Uint8Array.from(atob(s), c => c.charCodeAt(0));
}
function refreshNotifyBtn() {
  const b = document.getElementById('notifyBtn');
  const on = notifySupported() && Notification.permission === 'granted';
  b.textContent = on ? 'الإشعارات مفعّلة' : 'تفعيل الإشعارات';
}
async function enableNotifications() {
  if (!notifySupported()) {
    alert('الإشعارات غير مدعومة في هذا المتصفح. على الآيفون: افتحي التطبيق من الشاشة الرئيسية (مشاركة ← إضافة إلى الشاشة الرئيسية).');
    return;
  }
  const perm = await Notification.requestPermission();
  if (perm !== 'granted') {
    alert('يجب السماح بالإشعارات من إعدادات المتصفح');
    refreshNotifyBtn();
    return;
  }
  try {
    const reg = await navigator.serviceWorker.ready;
    let sub = await reg.pushManager.getSubscription();
    if (!sub) {
      sub = await reg.pushManager.subscribe({
        userVisibleOnly: true,
        applicationServerKey: b64ToBytes(VAPID_PUBLIC_KEY),
      });
    }
    const j = sub.toJSON();
    const { error } = await sb.from('push_subscriptions').upsert({
      user_id: state.profile.id,
      endpoint: j.endpoint,
      p256dh: j.keys.p256dh,
      auth_key: j.keys.auth,
    }, { onConflict: 'endpoint' });
    if (error) throw error;
    alert('تم تفعيل الإشعارات على هذا الجهاز');
  } catch (err) {
    alert('تعذّر التفعيل: ' + (err.message || err));
  }
  refreshNotifyBtn();
}
// Fire-and-forget: a failed notification never blocks saving the data
function notifyStaff(title, body) {
  sb.functions.invoke('notify', { body: { title, body, url: './' } }).catch(() => {});
}
document.getElementById('notifyBtn').addEventListener('click', enableNotifications);
refreshNotifyBtn();
